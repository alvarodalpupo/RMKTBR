# Publica o site no GitHub Pages a cada atualização da branch main.
# Configuração única no GitHub: Settings → Pages → Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Regera o site a cada 6 horas para os anúncios novos entrarem no sitemap
  # e ganharem página própria para o Google
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verificar tipos e código
        run: pnpm typecheck && pnpm lint

      - name: Gerar o site (+ páginas para o Google, sitemap e robots.txt)
        run: pnpm build
        env:
          # Sem estas duas, o site sobe em modo demonstração (anúncios de exemplo).
          # Settings → Secrets and variables → Actions → aba "Variables".
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_INSTAGRAM_ACCESS_TOKEN: ${{ vars.VITE_INSTAGRAM_ACCESS_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
